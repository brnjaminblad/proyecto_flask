<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio 1</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="contenedor">
      <h1>Formulario Compra Pintura</h1>

      <form method="POST">
        <input
          type="text"
          name="nombre"
          placeholder="Ingrese nombre"
          required
        />

        <input
          type="number"
          name="edad"
          placeholder="Ingrese edad"
          min="1"
          required
        />

        <input
          type="number"
          name="tarros"
          placeholder="Cantidad tarros"
          min="1"
          required
        />

        <button type="submit">Calcular</button>
      </form>
      {% if resultado %}

      <h2>Cliente: {{ resultado.nombre }}</h2>

      <h2>Total sin descuento: ${{ resultado.total }}</h2>

      <h2>Descuento aplicado: {{ resultado.descuento }}%</h2>

      <h2>Total a pagar: ${{ resultado.final }}</h2>

      {% endif %}
      <br />

      <a href="/">
        <button>Volver</button>
      </a>
    </div>
  </body>
</html>
